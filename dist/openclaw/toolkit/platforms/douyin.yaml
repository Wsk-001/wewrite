name: "douyin"
description: "抖音/头条风格，大字标题，短段落，大间距，适合移动端快速阅读"
colors:
  primary: "#1e1e1e"
  secondary: "#3b3b3b"
  text: "#1a1a1a"
  text_light: "#666666"
  background: "#ffffff"
  code_bg: "#f5f5f5"
  code_color: "#d73a49"
  quote_border: "#1e1e1e"
  quote_bg: "#f5f5f5"
  border_radius: "0px"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 18px;
    line-height: 2.0;
    color: #1a1a1a;
    background: #ffffff;
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    word-wrap: break-word;
  }
  h1 { font-size: 28px; font-weight: 800; color: #1a1a1a; margin: 36px 0 20px 0; line-height: 1.4; }
  h2 { font-size: 24px; font-weight: 700; color: #1a1a1a; margin: 32px 0 16px 0; line-height: 1.4; }
  h3 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin: 28px 0 14px 0; line-height: 1.4; }
  p { font-size: 18px; line-height: 2.0; color: #1a1a1a; margin: 20px 0; }
  strong { font-weight: 700; color: #1a1a1a; }
  blockquote { border-left: 4px solid #1e1e1e; background: #f5f5f5; margin: 20px 0; padding: 16px 20px; color: #555; }
  ul, ol { padding-left: 28px; margin: 20px 0; }
  li { font-size: 18px; line-height: 2.0; color: #1a1a1a; margin: 10px 0; }
  img { max-width: 100%; display: block; margin: 28px auto; }
  hr { border: none; border-top: 1px solid #e0e0e0; margin: 32px 0; }
