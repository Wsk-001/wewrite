name: "bg-health-chroniccare"
description: "健康-慢病管理紫：柔和紫底白卡，慢病随访/健康管理温柔专业"
page_background: "linear-gradient(165deg, #f0ecfa 0%, #f3f0fc 55%, #f8f6fd 100%)"
page_padding: "30px 24px"
css_randomize: true
colors:
  primary: "#6a5ac0"
  secondary: "#5344a0"
  text: "#3a3550"
  text_light: "#8880a4"
  background: "#ffffff"
  code_bg: "#e8e2f8"
  code_color: "#5344a0"
  quote_border: "#6a5ac0"
  quote_bg: "#ffffff"
  border_radius: "12px"
  highlight_bg: "#ffffff"
  highlight_border: "rgba(106,90,192,0.16)"
  summary_bg: "#ffffff"
  summary_border: "rgba(106,90,192,0.16)"
darkmode:
  background: "#171326"
  text: "#d8d2ec"
  text_light: "#968eae"
  primary: "#9a8ae0"
  code_bg: "#221c38"
  code_color: "#c0b0f0"
  quote_bg: "#ffffff"
  quote_border: "#6a5ac0"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #3a3550;
  }

  h1 { font-size: 23px; font-weight: 800; color: #3a2f7a; margin: 0 0 18px 0; padding-bottom: 12px; border-bottom: 2px solid #6a5ac0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #5344a0; margin: 24px 0 14px 0; padding: 12px 16px; background: #ffffff; border-radius: 12px; border-left: 5px solid #6a5ac0; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #5344a0; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #6a5ac0; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.9; color: #3a3550; margin: 14px 0; }
  strong { font-weight: 700; color: #5344a0; }
  em { font-style: italic; color: #3a3550; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #e8e2f8; color: #5344a0; padding: 2px 6px; border-radius: 6px; }
  pre { background: #ffffff; color: #5344a0; padding: 16px; border-radius: 12px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(106,90,192,0.14); }
  pre code { background: none; color: #5344a0; padding: 0; }
  blockquote { border-left: 4px solid #6a5ac0; background: #ffffff; margin: 16px 0; padding: 14px 16px; border-radius: 0 12px 12px 0; color: #443e60; }
  blockquote p { margin: 8px 0; color: #443e60; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.9; color: #3a3550; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #ffffff; border-radius: 12px; overflow: hidden; }
  thead { background: #6a5ac0; }
  th { background: #6a5ac0; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #6a5ac0; }
  td { padding: 10px 14px; border: 1px solid rgba(106,90,192,0.14); color: #3a3550; }
  tr { background: #ffffff; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 12px; }
  a { color: #6a5ac0; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(106,90,192,0.16); margin: 24px 0; }
