name: "bg-health-healing"
description: "健康-疗愈治愈：极简米咖底配暖棕细线，极简杂志风，身心疗愈/睡眠热门"
page_background: "#f2ede6"
page_padding: "30px 24px"
css_randomize: true
colors:
  primary: "#8a6a4a"
  secondary: "#6a5238"
  text: "#3f382e"
  text_light: "#9a8e7c"
  background: "#fffdf9"
  code_bg: "#e8e0d4"
  code_color: "#6a5238"
  quote_border: "#8a6a4a"
  quote_bg: "#fffdf9"
  border_radius: "8px"
  highlight_bg: "#fffdf9"
  highlight_border: "rgba(138,106,74,0.16)"
  summary_bg: "#fffdf9"
  summary_border: "rgba(138,106,74,0.16)"
darkmode:
  background: "#211c16"
  text: "#ded4c4"
  text_light: "#a89a88"
  primary: "#c0a080"
  code_bg: "#2c251c"
  code_color: "#d8bca0"
  quote_bg: "#fffdf9"
  quote_border: "#8a6a4a"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 2.0;
    color: #3f382e;
    letter-spacing: 0.3px;
  }

  h1 { font-size: 22px; font-weight: 700; color: #4a4032; margin: 0 0 16px 0; line-height: 1.5; letter-spacing: 0.5px; }
  h2 { font-size: 18px; font-weight: 700; color: #6a5238; margin: 30px 0 14px 0; padding: 0 0 8px 0; border-bottom: 1px solid #d4c8b8; line-height: 1.6; }
  h3 { font-size: 16px; font-weight: 700; color: #8a6a4a; margin: 22px 0 12px 0; line-height: 1.6; }
  h4 { font-size: 15px; font-weight: 700; color: #8a6a4a; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 2.0; color: #3f382e; margin: 16px 0; }
  strong { font-weight: 700; color: #6a5238; }
  em { font-style: italic; color: #8a7a64; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #e8e0d4; color: #6a5238; padding: 2px 6px; border-radius: 4px; }
  pre { background: #fffdf9; color: #6a5238; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(138,106,74,0.14); }
  pre code { background: none; color: #6a5238; padding: 0; }
  blockquote { border-left: 2px solid #8a6a4a; background: #fffdf9; margin: 20px 0; padding: 14px 18px; border-radius: 0; color: #5a5040; }
  blockquote p { margin: 8px 0; color: #5a5040; }
  ul, ol { padding-left: 22px; margin: 14px 0; }
  li { font-size: 16px; line-height: 2.0; color: #3f382e; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #fffdf9; }
  thead { background: #6a5238; }
  th { background: #6a5238; color: #fffdf9; font-weight: 600; padding: 10px 14px; text-align: left; border: 1px solid #6a5238; }
  td { padding: 10px 14px; border: 1px solid #e0d8c8; color: #3f382e; }
  tr { background: #fffdf9; }
  img { max-width: 100%; height: auto; display: block; margin: 26px auto; border-radius: 8px; }
  a { color: #8a6a4a; text-decoration: none; font-weight: 600; border-bottom: 1px solid #d4c8b8; }
  hr { border: none; border-top: 1px solid #e0d8c8; margin: 28px 0; }
