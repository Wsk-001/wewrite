name: "bg-health-tcm-herb"
description: "健康-中医草本：艾草绿底配暖木棕描边，古风淡雅，中医馆/养生馆热门"
page_background: "#eef3e6"
page_padding: "30px 24px"
css_randomize: true
colors:
  primary: "#4e7a3a"
  secondary: "#8a6a3a"
  text: "#33392a"
  text_light: "#7f8a6a"
  background: "#fdfef9"
  code_bg: "#e3ecd4"
  code_color: "#4e7a3a"
  quote_border: "#4e7a3a"
  quote_bg: "#fdfef9"
  border_radius: "6px"
  highlight_bg: "#fdfef9"
  highlight_border: "rgba(78,122,58,0.18)"
  summary_bg: "#fdfef9"
  summary_border: "rgba(78,122,58,0.18)"
darkmode:
  background: "#1a2014"
  text: "#d4dcc4"
  text_light: "#96a284"
  primary: "#88b06a"
  code_bg: "#242e1a"
  code_color: "#a8c88a"
  quote_bg: "#fdfef9"
  quote_border: "#4e7a3a"
base_css: |
  body {
    font-family: Georgia, "Songti SC", "STSong", "SimSun", serif;
    font-size: 16px;
    line-height: 2.0;
    color: #33392a;
  }

  h1 { font-size: 23px; font-weight: 700; color: #3d5c2c; margin: 0 0 16px 0; padding-bottom: 10px; border-bottom: 2px solid #8a6a3a; line-height: 1.5; }
  h2 { font-size: 19px; font-weight: 700; color: #4e7a3a; margin: 28px 0 14px 0; padding: 10px 16px; background: #fdfef9; border-radius: 6px; border-left: 5px solid #4e7a3a; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #4e7a3a; margin: 22px 0 12px 0; padding-left: 12px; border-left: 4px solid #8a6a3a; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #4e7a3a; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 2.0; color: #33392a; margin: 14px 0; }
  strong { font-weight: 700; color: #8a6a3a; }
  em { font-style: italic; color: #33392a; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #e3ecd4; color: #4e7a3a; padding: 2px 6px; border-radius: 4px; }
  pre { background: #fdfef9; color: #4e7a3a; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(78,122,58,0.16); }
  pre code { background: none; color: #4e7a3a; padding: 0; }
  blockquote { border-left: 4px solid #4e7a3a; background: #fdfef9; margin: 16px 0; padding: 16px 18px; border-radius: 0 6px 6px 0; color: #445030; }
  blockquote p { margin: 8px 0; color: #445030; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 2.0; color: #33392a; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #fdfef9; }
  thead { background: #4e7a3a; }
  th { background: #4e7a3a; color: #fdfef9; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #4e7a3a; }
  td { padding: 10px 14px; border: 1px solid #d8e0c8; color: #33392a; }
  tr { background: #fdfef9; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 6px; }
  a { color: #4e7a3a; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid #8a6a3a; margin: 24px 0; }
