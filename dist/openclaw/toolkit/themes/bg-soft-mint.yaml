name: "bg-soft-mint"
description: "薄荷淡绿底：淡薄荷绿背景，清爽疗愈，适合养生与疾病预防科普"
page_background: "#edf6f0"
page_padding: "28px 22px"
css_randomize: true
colors:
  primary: "#3a9a72"
  secondary: "#287a58"
  text: "#33413a"
  text_light: "#79988a"
  background: "#fbfefc"
  code_bg: "#e0f0e8"
  code_color: "#287a58"
  quote_border: "#3a9a72"
  quote_bg: "#f4fbf7"
  border_radius: "12px"
  highlight_bg: "#fbfefc"
  highlight_border: "rgba(58,154,114,0.2)"
  summary_bg: "#fbfefc"
  summary_border: "rgba(58,154,114,0.2)"
darkmode:
  background: "#14241d"
  text: "#cfe2d8"
  text_light: "#8aab9c"
  primary: "#5fc89c"
  code_bg: "#1e322a"
  code_color: "#9fe0c0"
  quote_bg: "#f4fbf7"
  quote_border: "#3a9a72"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #33413a;
  }

  h1 { font-size: 23px; font-weight: 800; color: #294a3a; margin: 0 0 18px 0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #287a58; margin: 24px 0 14px 0; padding: 12px 16px; background: #fbfefc; border-radius: 12px; border-left: 5px solid #3a9a72; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #3a9a72; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #3a9a72; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.9; color: #33413a; margin: 14px 0; }
  strong { font-weight: 700; color: #287a58; }
  em { font-style: italic; color: #33413a; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #e0f0e8; color: #287a58; padding: 2px 6px; border-radius: 6px; }
  pre { background: #fbfefc; color: #287a58; padding: 16px; border-radius: 12px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(58,154,114,0.18); }
  pre code { background: none; color: #287a58; padding: 0; }
  blockquote { border-left: 4px solid #3a9a72; background: #fbfefc; margin: 16px 0; padding: 14px 16px; border-radius: 0 12px 12px 0; color: #3a5c4a; }
  blockquote p { margin: 8px 0; color: #3a5c4a; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.9; color: #33413a; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #fbfefc; border-radius: 12px; overflow: hidden; }
  thead { background: #3a9a72; }
  th { background: #3a9a72; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #3a9a72; }
  td { padding: 10px 14px; border: 1px solid rgba(58,154,114,0.18); color: #33413a; }
  tr { background: #fbfefc; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 12px; }
  a { color: #3a9a72; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(58,154,114,0.2); margin: 24px 0; }
