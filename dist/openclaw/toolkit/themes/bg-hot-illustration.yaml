name: "bg-hot-illustration"
description: "热门插画暖黄：暖阳黄渐变底配白卡，手绘温暖感，治愈科普与母婴热门"
page_background: "linear-gradient(160deg, #fdf3d8 0%, #fbeecf 55%, #fdf6e4 100%)"
page_padding: "30px 24px"
css_randomize: true
colors:
  primary: "#c98a2a"
  secondary: "#a86e18"
  text: "#4a3d24"
  text_light: "#9a8860"
  background: "#ffffff"
  code_bg: "#f8ebc8"
  code_color: "#a86e18"
  quote_border: "#c98a2a"
  quote_bg: "#ffffff"
  border_radius: "16px"
  highlight_bg: "#ffffff"
  highlight_border: "rgba(201,138,42,0.2)"
  summary_bg: "#ffffff"
  summary_border: "rgba(201,138,42,0.2)"
darkmode:
  background: "#241e10"
  text: "#e4d6b8"
  text_light: "#ab9a76"
  primary: "#e0b060"
  code_bg: "#2e2714"
  code_color: "#e8c888"
  quote_bg: "#ffffff"
  quote_border: "#c98a2a"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.95;
    color: #4a3d24;
  }

  h1 { font-size: 23px; font-weight: 800; color: #6a521c; margin: 0 0 18px 0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #a86e18; margin: 24px 0 14px 0; padding: 12px 16px; background: #ffffff; border-radius: 16px; line-height: 1.5; box-shadow: 0 2px 10px rgba(180,130,40,0.08); }
  h3 { font-size: 17px; font-weight: 700; color: #c98a2a; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #c98a2a; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.95; color: #4a3d24; margin: 14px 0; }
  strong { font-weight: 700; color: #a86e18; }
  em { font-style: italic; color: #4a3d24; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #f8ebc8; color: #a86e18; padding: 2px 6px; border-radius: 6px; }
  pre { background: #ffffff; color: #a86e18; padding: 16px; border-radius: 16px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(201,138,42,0.18); }
  pre code { background: none; color: #a86e18; padding: 0; }
  blockquote { border-left: 4px solid #c98a2a; background: #ffffff; margin: 16px 0; padding: 16px 18px; border-radius: 0 16px 16px 0; color: #6a5620; }
  blockquote p { margin: 8px 0; color: #6a5620; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.95; color: #4a3d24; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #ffffff; border-radius: 16px; overflow: hidden; }
  thead { background: #c98a2a; }
  th { background: #c98a2a; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #c98a2a; }
  td { padding: 10px 14px; border: 1px solid rgba(201,138,42,0.18); color: #4a3d24; }
  tr { background: #ffffff; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 16px; }
  a { color: #c98a2a; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(201,138,42,0.2); margin: 24px 0; }
