name: "bg-hot-cream"
description: "热门奶油风：奶油黄底配白卡与圆角，温柔治愈，小红书/生活类账号爆款"
page_background: "#fbf1e0"
page_padding: "30px 24px"
css_randomize: true
colors:
  primary: "#d98a3a"
  secondary: "#b06a22"
  text: "#4a3b28"
  text_light: "#9a8468"
  background: "#ffffff"
  code_bg: "#f8ebd6"
  code_color: "#a5601e"
  quote_border: "#d98a3a"
  quote_bg: "#fffdf8"
  border_radius: "18px"
  highlight_bg: "#ffffff"
  highlight_border: "rgba(217,138,58,0.2)"
  summary_bg: "#ffffff"
  summary_border: "rgba(217,138,58,0.2)"
darkmode:
  background: "#241c10"
  text: "#e0d0b8"
  text_light: "#a89478"
  primary: "#e8a860"
  code_bg: "#2e2414"
  code_color: "#e8bc84"
  quote_bg: "#fffdf8"
  quote_border: "#d98a3a"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.95;
    color: #4a3b28;
  }

  h1 { font-size: 23px; font-weight: 800; color: #6a4a1e; margin: 0 0 18px 0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #b06a22; margin: 24px 0 14px 0; padding: 12px 18px; background: #ffffff; border-radius: 18px; line-height: 1.5; box-shadow: 0 2px 10px rgba(180,120,40,0.08); }
  h3 { font-size: 17px; font-weight: 700; color: #d98a3a; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #d98a3a; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.95; color: #4a3b28; margin: 14px 0; }
  strong { font-weight: 700; color: #b06a22; }
  em { font-style: italic; color: #4a3b28; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #f8ebd6; color: #a5601e; padding: 2px 6px; border-radius: 8px; }
  pre { background: #ffffff; color: #a5601e; padding: 16px; border-radius: 18px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(217,138,58,0.18); }
  pre code { background: none; color: #a5601e; padding: 0; }
  blockquote { border-left: 4px solid #d98a3a; background: #ffffff; margin: 16px 0; padding: 16px 18px; border-radius: 0 18px 18px 0; color: #6a5030; }
  blockquote p { margin: 8px 0; color: #6a5030; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.95; color: #4a3b28; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #ffffff; border-radius: 18px; overflow: hidden; }
  thead { background: #d98a3a; }
  th { background: #d98a3a; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #d98a3a; }
  td { padding: 10px 14px; border: 1px solid rgba(217,138,58,0.18); color: #4a3b28; }
  tr { background: #ffffff; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 18px; }
  a { color: #d98a3a; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(217,138,58,0.2); margin: 24px 0; }
