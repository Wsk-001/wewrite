name: "bg-lavender"
description: "薰衣草紫底：柔紫背景配白卡片，宁静治愈，适合心理健康与情绪科普"
page_background: "#f2effa"
page_padding: "28px 22px"
css_randomize: true
colors:
  primary: "#7a63c4"
  secondary: "#5e4aa8"
  text: "#403a52"
  text_light: "#8880a0"
  background: "#ffffff"
  code_bg: "#e8e2f8"
  code_color: "#5e4aa8"
  quote_border: "#7a63c4"
  quote_bg: "#f7f5ff"
  border_radius: "14px"
  highlight_bg: "#ffffff"
  highlight_border: "rgba(122,99,196,0.18)"
  summary_bg: "#ffffff"
  summary_border: "rgba(122,99,196,0.18)"
darkmode:
  background: "#1a1726"
  text: "#d6d0e6"
  text_light: "#918aa8"
  primary: "#a898e0"
  code_bg: "#242036"
  code_color: "#c8bcf0"
  quote_bg: "#f7f5ff"
  quote_border: "#7a63c4"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.95;
    color: #403a52;
  }

  h1 { font-size: 23px; font-weight: 800; color: #3a3450; margin: 0 0 18px 0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #5e4aa8; margin: 24px 0 14px 0; padding: 12px 16px; background: #ffffff; border-radius: 14px; border-left: 5px solid #7a63c4; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #7a63c4; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #7a63c4; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.95; color: #403a52; margin: 14px 0; }
  strong { font-weight: 700; color: #5e4aa8; }
  em { font-style: italic; color: #403a52; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #e8e2f8; color: #5e4aa8; padding: 2px 6px; border-radius: 6px; }
  pre { background: #ffffff; color: #5e4aa8; padding: 16px; border-radius: 14px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(122,99,196,0.16); }
  pre code { background: none; color: #5e4aa8; padding: 0; }
  blockquote { border-left: 4px solid #7a63c4; background: #ffffff; margin: 16px 0; padding: 14px 16px; border-radius: 0 14px 14px 0; color: #4a4268; }
  blockquote p { margin: 8px 0; color: #4a4268; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.95; color: #403a52; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #ffffff; border-radius: 14px; overflow: hidden; }
  thead { background: #7a63c4; }
  th { background: #7a63c4; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #7a63c4; }
  td { padding: 10px 14px; border: 1px solid rgba(122,99,196,0.16); color: #403a52; }
  tr { background: #ffffff; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 14px; }
  a { color: #7a63c4; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(122,99,196,0.18); margin: 24px 0; }
