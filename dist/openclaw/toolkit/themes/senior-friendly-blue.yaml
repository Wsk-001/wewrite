name: "senior-friendly-blue"
description: "大字适老蓝：加大字号、高对比、圆角卡片，适合面向中老年读者的健康科普"
colors:
  primary: "#1565c0"
  secondary: "#0d47a1"
  text: "#2a2f38"
  text_light: "#5b6672"
  background: "#ffffff"
  code_bg: "#f5f9ff"
  code_color: "#0d47a1"
  quote_border: "#1565c0"
  quote_bg: "#f5f9ff"
  border_radius: "14px"
  highlight_bg: "#f5f9ff"
  highlight_border: "rgba(21,101,192,0.2)"
  summary_bg: "#f5f9ff"
  summary_border: "rgba(21,101,192,0.2)"
darkmode:
  background: "#0f1720"
  text: "#d5dde8"
  text_light: "#96a2b0"
  primary: "#6cb0ff"
  code_bg: "#132234"
  code_color: "#9cc8ff"
  quote_bg: "#132234"
  quote_border: "#1565c0"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 18px;
    line-height: 2.0;
    color: #2a2f38;
    background: #ffffff;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    color: #0d47a1;
    margin: 34px 0 18px 0;
    padding-bottom: 14px;
    border-bottom: 3px solid #1565c0;
    line-height: 1.5;
  }

  h2 {
    font-size: 22px;
    font-weight: 800;
    color: #1565c0;
    margin: 30px 0 16px 0;
    padding: 10px 16px;
    background: #f5f9ff;
    border-radius: 14px;
    line-height: 1.5;
  }

  h3 {
    font-size: 20px;
    font-weight: 800;
    color: #1565c0;
    margin: 26px 0 14px 0;
    line-height: 1.5;
  }

  h4 {
    font-size: 18px;
    font-weight: 700;
    color: #1565c0;
    margin: 22px 0 12px 0;
    line-height: 1.5;
  }

  p {
    font-size: 18px;
    line-height: 2.0;
    color: #2a2f38;
    margin: 16px 0;
  }

  strong {
    font-weight: 800;
    color: #0d47a1;
  }

  em {
    font-style: italic;
    color: #2a2f38;
  }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 15px;
    background: #f5f9ff;
    color: #0d47a1;
    padding: 2px 6px;
    border-radius: 6px;
  }

  pre {
    background: #f5f9ff;
    color: #0d47a1;
    padding: 18px;
    border-radius: 14px;
    overflow-x: auto;
    margin: 18px 0;
    line-height: 1.7;
    border: 1px solid #d6e6fb;
  }

  pre code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 15px;
    background: none;
    color: #0d47a1;
    padding: 0;
    border-radius: 0;
  }

  blockquote {
    border-left: 5px solid #1565c0;
    background: #f5f9ff;
    margin: 18px 0;
    padding: 16px 18px;
    border-radius: 0 14px 14px 0;
    color: #23405c;
  }

  blockquote p {
    margin: 10px 0;
    color: #23405c;
  }

  ul {
    padding-left: 26px;
    margin: 14px 0;
  }

  ol {
    padding-left: 26px;
    margin: 14px 0;
  }

  li {
    font-size: 18px;
    line-height: 2.0;
    color: #2a2f38;
    margin: 10px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 18px 0;
    font-size: 16px;
  }

  thead {
    background: #1565c0;
  }

  th {
    background: #1565c0;
    color: #ffffff;
    font-weight: 700;
    padding: 12px 14px;
    text-align: left;
    border: 1px solid #1565c0;
  }

  td {
    padding: 12px 14px;
    border: 1px solid #d6e6fb;
    color: #2a2f38;
  }

  tr {
    background: #ffffff;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 26px auto;
    border-radius: 14px;
  }

  a {
    color: #1565c0;
    text-decoration: none;
    font-weight: 600;
  }

  hr {
    border: none;
    border-top: 2px solid #d6e6fb;
    margin: 26px 0;
  }
