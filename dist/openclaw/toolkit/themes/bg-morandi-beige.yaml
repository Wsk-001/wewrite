name: "bg-morandi-beige"
description: "莫兰迪燕麦底：低饱和奶咖底色，温柔高级，适合生活方式与健康科普"
page_background: "#f4efe8"
page_padding: "28px 22px"
css_randomize: true
colors:
  primary: "#a0785a"
  secondary: "#8a6a4f"
  text: "#4a4038"
  text_light: "#8a7d70"
  background: "#f4efe8"
  code_bg: "#eae2d8"
  code_color: "#7a5c44"
  quote_border: "#a0785a"
  quote_bg: "#efe7dd"
  border_radius: "10px"
  highlight_bg: "#efe7dd"
  highlight_border: "rgba(160,120,90,0.2)"
  summary_bg: "#efe7dd"
  summary_border: "rgba(160,120,90,0.2)"
darkmode:
  background: "#241f1a"
  text: "#ddd2c6"
  text_light: "#a3947f"
  primary: "#d0a880"
  code_bg: "#2e2822"
  code_color: "#e0c4a4"
  quote_bg: "#2e2822"
  quote_border: "#a0785a"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #4a4038;
  }

  h1 { font-size: 23px; font-weight: 800; color: #4a4038; margin: 0 0 18px 0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #8a6a4f; margin: 28px 0 14px 0; padding: 8px 14px; background: #efe7dd; border-radius: 10px; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #a0785a; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #a0785a; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.9; color: #4a4038; margin: 14px 0; }
  strong { font-weight: 700; color: #8a6a4f; }
  em { font-style: italic; color: #4a4038; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #eae2d8; color: #7a5c44; padding: 2px 6px; border-radius: 6px; }
  pre { background: #eae2d8; color: #7a5c44; padding: 16px; border-radius: 10px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid #ddd3c6; }
  pre code { background: none; color: #7a5c44; padding: 0; }
  blockquote { border-left: 4px solid #a0785a; background: #efe7dd; margin: 16px 0; padding: 14px 16px; border-radius: 0 10px 10px 0; color: #5a4c40; }
  blockquote p { margin: 8px 0; color: #5a4c40; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.9; color: #4a4038; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; }
  thead { background: #a0785a; }
  th { background: #a0785a; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #a0785a; }
  td { padding: 10px 14px; border: 1px solid #ddd3c6; color: #4a4038; background: #fbf8f4; }
  tr { background: #fbf8f4; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 10px; }
  a { color: #a0785a; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid #ddd3c6; margin: 24px 0; }
