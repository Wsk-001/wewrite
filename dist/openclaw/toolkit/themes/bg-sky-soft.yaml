name: "bg-sky-soft"
description: "天空淡蓝底：淡蓝背景配纯白卡片，清爽可信，适合呼吸与免疫类健康科普"
page_background: "#eef4fb"
page_padding: "28px 22px"
css_randomize: true
colors:
  primary: "#2f6fb5"
  secondary: "#1f5590"
  text: "#33404e"
  text_light: "#7a8899"
  background: "#ffffff"
  code_bg: "#e2edf8"
  code_color: "#1f5590"
  quote_border: "#2f6fb5"
  quote_bg: "#f4f9ff"
  border_radius: "12px"
  highlight_bg: "#ffffff"
  highlight_border: "rgba(47,111,181,0.18)"
  summary_bg: "#ffffff"
  summary_border: "rgba(47,111,181,0.18)"
darkmode:
  background: "#141d2a"
  text: "#d2dbe6"
  text_light: "#8a97a8"
  primary: "#6ba6e0"
  code_bg: "#1e2a3a"
  code_color: "#a8cdf0"
  quote_bg: "#f4f9ff"
  quote_border: "#2f6fb5"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #33404e;
  }

  h1 { font-size: 23px; font-weight: 800; color: #22303e; margin: 0 0 18px 0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #1f5590; margin: 24px 0 14px 0; padding: 12px 16px; background: #ffffff; border-radius: 12px; border-left: 5px solid #2f6fb5; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #2f6fb5; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #2f6fb5; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.9; color: #33404e; margin: 14px 0; }
  strong { font-weight: 700; color: #1f5590; }
  em { font-style: italic; color: #33404e; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #e2edf8; color: #1f5590; padding: 2px 6px; border-radius: 6px; }
  pre { background: #ffffff; color: #1f5590; padding: 16px; border-radius: 12px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(47,111,181,0.16); }
  pre code { background: none; color: #1f5590; padding: 0; }
  blockquote { border-left: 4px solid #2f6fb5; background: #ffffff; margin: 16px 0; padding: 14px 16px; border-radius: 0 12px 12px 0; color: #3a5068; }
  blockquote p { margin: 8px 0; color: #3a5068; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.9; color: #33404e; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #ffffff; border-radius: 12px; overflow: hidden; }
  thead { background: #2f6fb5; }
  th { background: #2f6fb5; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #2f6fb5; }
  td { padding: 10px 14px; border: 1px solid rgba(47,111,181,0.16); color: #33404e; }
  tr { background: #ffffff; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 12px; }
  a { color: #2f6fb5; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(47,111,181,0.18); margin: 24px 0; }
