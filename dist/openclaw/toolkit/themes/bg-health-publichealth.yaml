name: "bg-health-publichealth"
description: "健康-公共卫生蓝：清爽蓝底白卡，慢病筛查/公卫宣传规范专业"
page_background: "linear-gradient(165deg, #e8f1fb 0%, #eef5fc 55%, #f4f9fe 100%)"
page_padding: "30px 24px"
css_randomize: true
colors:
  primary: "#2a6fb0"
  secondary: "#1d5a94"
  text: "#2c3a48"
  text_light: "#7a8a9c"
  background: "#ffffff"
  code_bg: "#dceaf8"
  code_color: "#1d5a94"
  quote_border: "#2a6fb0"
  quote_bg: "#ffffff"
  border_radius: "10px"
  highlight_bg: "#ffffff"
  highlight_border: "rgba(42,111,176,0.16)"
  summary_bg: "#ffffff"
  summary_border: "rgba(42,111,176,0.16)"
darkmode:
  background: "#0f1a26"
  text: "#ccdcec"
  text_light: "#8a9aac"
  primary: "#5a9ae0"
  code_bg: "#17293c"
  code_color: "#a0c8f0"
  quote_bg: "#ffffff"
  quote_border: "#2a6fb0"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #2c3a48;
  }

  h1 { font-size: 23px; font-weight: 800; color: #173d63; margin: 0 0 18px 0; padding-bottom: 12px; border-bottom: 2px solid #2a6fb0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #1d5a94; margin: 24px 0 14px 0; padding: 12px 16px; background: #ffffff; border-radius: 10px; border-left: 5px solid #2a6fb0; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #1d5a94; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #2a6fb0; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.9; color: #2c3a48; margin: 14px 0; }
  strong { font-weight: 700; color: #1d5a94; }
  em { font-style: italic; color: #2c3a48; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #dceaf8; color: #1d5a94; padding: 2px 6px; border-radius: 6px; }
  pre { background: #ffffff; color: #1d5a94; padding: 16px; border-radius: 10px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(42,111,176,0.14); }
  pre code { background: none; color: #1d5a94; padding: 0; }
  blockquote { border-left: 4px solid #2a6fb0; background: #ffffff; margin: 16px 0; padding: 14px 16px; border-radius: 0 10px 10px 0; color: #324458; }
  blockquote p { margin: 8px 0; color: #324458; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.9; color: #2c3a48; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #ffffff; border-radius: 10px; overflow: hidden; }
  thead { background: #2a6fb0; }
  th { background: #2a6fb0; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #2a6fb0; }
  td { padding: 10px 14px; border: 1px solid rgba(42,111,176,0.14); color: #2c3a48; }
  tr { background: #ffffff; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 10px; }
  a { color: #2a6fb0; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(42,111,176,0.16); margin: 24px 0; }
