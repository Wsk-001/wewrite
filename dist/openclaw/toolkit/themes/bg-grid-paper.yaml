name: "bg-grid-paper"
description: "网格纸底：浅灰网格纹理背景配白卡片，理性条理，适合数据与清单科普"
page_background: "#f8f8f6"
page_padding: "28px 22px"
css_randomize: true
colors:
  primary: "#3b7a6a"
  secondary: "#2a5c50"
  text: "#333b3a"
  text_light: "#7a8483"
  background: "#ffffff"
  code_bg: "#e8f0ee"
  code_color: "#2a5c50"
  quote_border: "#3b7a6a"
  quote_bg: "#f2f9f7"
  border_radius: "10px"
  highlight_bg: "#ffffff"
  highlight_border: "rgba(59,122,106,0.18)"
  summary_bg: "#ffffff"
  summary_border: "rgba(59,122,106,0.18)"
darkmode:
  background: "#161d1c"
  text: "#d3dedb"
  text_light: "#8a9c98"
  primary: "#5fbfa6"
  code_bg: "#202b29"
  code_color: "#a0dcc8"
  quote_bg: "#f2f9f7"
  quote_border: "#3b7a6a"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.85;
    color: #333b3a;
  }

  h1 { font-size: 23px; font-weight: 800; color: #26302e; margin: 0 0 18px 0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #2a5c50; margin: 24px 0 14px 0; padding: 12px 16px; background: #ffffff; border-radius: 10px; border-top: 3px solid #3b7a6a; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #3b7a6a; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #3b7a6a; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.85; color: #333b3a; margin: 14px 0; }
  strong { font-weight: 700; color: #2a5c50; }
  em { font-style: italic; color: #333b3a; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #e8f0ee; color: #2a5c50; padding: 2px 6px; border-radius: 6px; }
  pre { background: #ffffff; color: #2a5c50; padding: 16px; border-radius: 10px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(59,122,106,0.16); }
  pre code { background: none; color: #2a5c50; padding: 0; }
  blockquote { border-left: 4px solid #3b7a6a; background: #ffffff; margin: 16px 0; padding: 14px 16px; border-radius: 0 10px 10px 0; color: #3a504a; }
  blockquote p { margin: 8px 0; color: #3a504a; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.85; color: #333b3a; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #ffffff; border-radius: 10px; overflow: hidden; }
  thead { background: #3b7a6a; }
  th { background: #3b7a6a; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #3b7a6a; }
  td { padding: 10px 14px; border: 1px solid rgba(59,122,106,0.16); color: #333b3a; }
  tr { background: #ffffff; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 10px; }
  a { color: #3b7a6a; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(59,122,106,0.18); margin: 24px 0; }
