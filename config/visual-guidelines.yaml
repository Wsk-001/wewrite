# WeWrite 视觉排版规范
# 从 gzh-design-skill 借鉴的公众号排版标准，用于方案A（纯规范借鉴）
# 2026-10-24 初版，基于摸鱼绿主题提取

# ============================================================
# 一、设计变量（字号/颜色/间距）
# ============================================================

# 字体栈
font_family: "-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"

# 字号与行距
typography:
  body_font_size: 14px          # 正文字号（不可改）
  body_line_height: 1.9         # 正文行高
  global_line_height: 1.75      # 全局行高
  letter_spacing: 0.5px         # 字间距
  heading_h2_size: 20px         # 二级标题
  heading_h3_size: 16px         # 三级标题

# 颜色系统（健康科普用摸鱼绿的中性灰阶为主，主色点缀）
colors:
  primary: "#059669"            # 主色（emerald-600）用于章节编号、锚点强调
  primary_light: "#A7F3D0"      # 浅绿下划线标记色
  highlight_yellow: "#FDE68A"   # 黄色高亮
  title: "#111827"              # 标题色
  body: "#374151"               # 正文色
  secondary: "#6B7280"          # 注释/标签
  border: "#D1D5DB"             # 分隔线
  background_light: "#F9FAFB"   # 极浅灰背景

# 间距
spacing:
  max_width: 677px              # 最大内容宽度
  content_padding: "0 20px"     # 内容区左右边距
  paragraph_margin: 16px        # 段落间距
  section_margin: 32px          # 章节间距

# ============================================================
# 二、视觉层级（三层递进）
# ============================================================

visual_hierarchy:
  # 锚点层：最强锚点，全文 ≤5 处
  anchor_layer:
    frequency: "≤5处/全文"
    usage: "产品名/步骤序号/核心金句/数据冲击"
    formatting: "主色加粗 / 深色底白字引用"
  
  # 标记层：正文关键词，每段 1-3 处
  marker_layer:
    frequency: "1-3处/段落"
    usage: "核心观点/结论/关键数据/专有名词"
    formatting: "下划线标记 / 加粗"
    phrase_length: "4-15字"
  
  # 容器层：引用块、概念标签、长句强调
  container_layer:
    frequency: "按需"
    usage: "引用块/荧光笔/徽章"
    formatting: "浅底引用 / 浅色背景高亮"

# ============================================================
# 三、排版规则
# ============================================================

layout_rules:
  # 标题层级
  headings:
    h1: "文章标题（# 标题）"
    h2: "章节标题（## 标题），自动编号 01/02/03"
    h3: "子章节（### 标题）"
    last_section_number: "末章用 ∞ 或 /// 代替数字编号"
  
  # 关键词下划线（核心特色）
  keyword_underline:
    rule: "对每个正文段落主动找出 1-3 个最重要的短语标记"
    priority: "核心观点 > 结论 > 关键数据 > 专有名词"
    phrase_length: "4-15字"
    no_whole_paragraph: "不整段划线"
    consistency: "每段都要标，不能有的段标有的段漏"
  
  # 标点规范
  punctuation:
    full_width: "正文标点一律全角（，。！？：；""''（）—— …）"
    half_width_exception: "代码块/行内代码/英文专名/URL 内部保持半角"
    quote_style: "直接写弯引号""''，不先写直引号再替换"
  
  # 图片处理
  images:
    style: "max-width:100%; height:auto; display:block; margin:0 auto"
    caption: "只有 ![说明](url) 里真有说明文字才加说明，空 alt 不编造"
    sizing: "按图片自身尺寸显示、居中，大图缩到容器宽、小图保持原尺寸"
  
  # 列表与强调
  emphasis:
    strong: "用**加粗**标记重点，每段 1-3 处"
    highlight: "用==高亮==或荧光笔效果"
    small_label: "突出小标题用左竖条或药丸标签，不用四周虚线框"
  
  # 引用与引言
  quotes:
    opening_quote: "文章开头的 > 引用块作为引言卡"
    inline_quote: "非开头的 > 文字作为引用段落"
    highlight_keywords: "识别金句里的核心词用高亮组件标记"
  
  # 作者签名区（仅末尾一处）
  author_signature:
    position: "文章末尾，有且仅有一个"
    format: |
      我是 {{作者名}}，{{一句话简介}}
      如果你觉得今天这篇有收获，欢迎**点赞、在看、转发**三连，我们下篇见
    placeholder_rule: "用户未提供署名时保留 {{作者名}} 占位，提示用户替换"
    merge_rule: "原文末尾已有作者签名段时直接沿用，不替换"

# ============================================================
# 四、避坑清单（Gotchas）
# ============================================================

pitfalls:
  - name: "关键词下划线"
    rule: "逐段落实，每段 1-3 个短语，不要整段划线或有的段标有的段漏"
  
  - name: "章节编号"
    rule: "严格按 ## 顺序 01/02/03，不跳号；结语编号变体只用于末章"
  
  - name: "签名区唯一"
    rule: "有且仅有末尾一个，原文末尾若已有作者签名并入这唯一的签名区"
  
  - name: "图片说明"
    rule: "只有 ![说明](url) 里真有说明文字才生成说明，![](url) 空 alt 不编造"
  
  - name: "锚点层滥用"
    rule: "最强强调全文 ≤5 处，到处加粗等于没有重点"
  
  - name: "标点混半角"
    rule: "正文出现半角逗号句号、英文直引号都要改成全角；代码块内半角保持原样"
  
  - name: "内容完整性"
    rule: "每个段落、每张图都要转换，不得遗漏；不自行增删原文实质内容"
  
  - name: "目录精选"
    rule: "前言导读展示精选的 3 个核心看点，不是完整章节列表"

# ============================================================
# 五、Markdown 映射规则
# ============================================================

markdown_mapping:
  "# 标题": "文章标题"
  "## 标题": "章节标题（自动编号 01/02/03）"
  "### 标题": "子章节"
  "**加粗**": "主色加粗或下划线标记"
  "==高亮==": "纯色浅底高亮"
  "<u>文字</u> 或 ++文字++": "下划线"
  "~~文字~~": "荧光笔（纯色浅底）"
  "> 引用": "引用高亮块"
  "![说明](url)": "图片+说明（有说明才加说明组件）"
  "![](url.gif)": "GIF（带动图角标）"
  "```代码块```": "深色或浅色代码块"
  "`code`": "行内代码"
  "- 项 或 1. 项": "列表（转为带缩进的正文段落或专属列表组件）"
  "--- 或 ***": "分割线"

# ============================================================
# 六、使用说明
# ============================================================

# 排版统一走 gzh-design 主题渲染（L1 传统排版已移除）：
# 1. gzh-design 主题由 toolkit/gzh_converter.py + toolkit/theme_configs.py 程序化实现
# 2. 用法: python toolkit/cli.py preview article.md --theme <gzh主题名>
# 3. 合规校验: .ai-ready/skills/gzh-design/scripts/validate_gzh_html.py
# 4. 产物可手动粘贴到公众号编辑器（不掉格式）
# 注意：API 推稿和手动粘贴的渲染效果可能不同，需实测验证
