name: "xiaohongshu"
description: "小红书风格，红橘色系，emoji点缀，标题醒目，适合种草和生活方式内容"
colors:
  primary: "#ff2442"
  secondary: "#ff6b81"
  text: "#2a2a2a"
  text_light: "#888888"
  background: "#ffffff"
  code_bg: "#fff5f5"
  code_color: "#ff2442"
  quote_border: "#ff2442"
  quote_bg: "#fff5f5"
  border_radius: "8px"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #2a2a2a;
    background: #ffffff;
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    word-wrap: break-word;
  }
  h1 { font-size: 24px; font-weight: 800; color: #ff2442; margin: 32px 0 16px 0; text-align: center; line-height: 1.4; }
  h2 { font-size: 20px; font-weight: 700; color: #ff2442; margin: 28px 0 14px 0; padding-left: 12px; border-left: 4px solid #ff2442; line-height: 1.4; }
  h3 { font-size: 18px; font-weight: 600; color: #ff6b81; margin: 24px 0 12px 0; line-height: 1.4; }
  p { font-size: 16px; line-height: 1.9; color: #2a2a2a; margin: 14px 0; }
  strong { font-weight: 700; color: #ff2442; }
  blockquote { border-left: 4px solid #ff2442; background: #fff5f5; margin: 16px 0; padding: 12px 16px; border-radius: 0 8px 8px 0; color: #555; }
  ul, ol { padding-left: 24px; margin: 14px 0; }
  li { font-size: 16px; line-height: 1.9; color: #2a2a2a; margin: 8px 0; }
  img { max-width: 100%; display: block; margin: 24px auto; border-radius: 8px; }
  hr { border: none; border-top: 1px solid #ffe0e0; margin: 28px 0; }
