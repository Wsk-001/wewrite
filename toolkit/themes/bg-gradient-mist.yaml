name: "bg-gradient-mist"
description: "弥散渐变底：淡青紫柔光渐变背景，现代通透，适合年轻化健康科普"
page_background: "linear-gradient(160deg, #eef3fb 0%, #f6f1fa 55%, #fdf3f6 100%)"
page_padding: "28px 22px"
css_randomize: true
colors:
  primary: "#5b6bd6"
  secondary: "#8a5bd6"
  text: "#3a3f52"
  text_light: "#7a8098"
  background: "#f4f4fb"
  code_bg: "#ecebff"
  code_color: "#4a4ac0"
  quote_border: "#5b6bd6"
  quote_bg: "#eef0ff"
  border_radius: "14px"
  highlight_bg: "rgba(255,255,255,0.72)"
  highlight_border: "rgba(91,107,214,0.16)"
  summary_bg: "rgba(255,255,255,0.72)"
  summary_border: "rgba(91,107,214,0.16)"
darkmode:
  background: "#181c2c"
  text: "#d2d6e6"
  text_light: "#8e93ab"
  primary: "#8f9df0"
  code_bg: "#232840"
  code_color: "#b0bcf8"
  quote_bg: "#232840"
  quote_border: "#5b6bd6"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #3a3f52;
  }

  h1 { font-size: 23px; font-weight: 800; color: #30344a; margin: 0 0 18px 0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #4a4ac0; margin: 28px 0 14px 0; padding: 10px 16px; background: rgba(255,255,255,0.7); border-radius: 14px; border: 1px solid rgba(91,107,214,0.14); line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #5b6bd6; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #5b6bd6; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.9; color: #3a3f52; margin: 14px 0; }
  strong { font-weight: 700; color: #4a4ac0; }
  em { font-style: italic; color: #3a3f52; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #ecebff; color: #4a4ac0; padding: 2px 6px; border-radius: 6px; }
  pre { background: rgba(255,255,255,0.78); color: #4a4ac0; padding: 16px; border-radius: 14px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(91,107,214,0.16); }
  pre code { background: none; color: #4a4ac0; padding: 0; }
  blockquote { border-left: 4px solid #5b6bd6; background: rgba(255,255,255,0.7); margin: 16px 0; padding: 14px 16px; border-radius: 0 14px 14px 0; color: #43486a; }
  blockquote p { margin: 8px 0; color: #43486a; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.9; color: #3a3f52; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: rgba(255,255,255,0.7); }
  thead { background: #5b6bd6; }
  th { background: #5b6bd6; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #5b6bd6; }
  td { padding: 10px 14px; border: 1px solid rgba(91,107,214,0.16); color: #3a3f52; background: rgba(255,255,255,0.6); }
  tr { background: transparent; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 14px; }
  a { color: #5b6bd6; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(91,107,214,0.18); margin: 24px 0; }
