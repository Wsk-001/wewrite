name: "bg-health-mentalcalm"
description: "健康-心理舒缓：雾霾蓝绿底配白卡，心理健康/压力舒缓/睡眠科普温和治愈"
page_background: "linear-gradient(165deg, #e6f0ee 0%, #ebf3f1 55%, #f2f8f6 100%)"
page_padding: "30px 24px"
css_randomize: true
colors:
  primary: "#4a8a7c"
  secondary: "#357064"
  text: "#33443f"
  text_light: "#7f948e"
  background: "#ffffff"
  code_bg: "#dceee9"
  code_color: "#357064"
  quote_border: "#4a8a7c"
  quote_bg: "#ffffff"
  border_radius: "16px"
  highlight_bg: "#ffffff"
  highlight_border: "rgba(74,138,124,0.16)"
  summary_bg: "#ffffff"
  summary_border: "rgba(74,138,124,0.16)"
darkmode:
  background: "#152420"
  text: "#d0e2dc"
  text_light: "#8fa8a0"
  primary: "#6fb8a8"
  code_bg: "#1e322c"
  code_color: "#a0d8cc"
  quote_bg: "#ffffff"
  quote_border: "#4a8a7c"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 2.0;
    color: #33443f;
    letter-spacing: 0.2px;
  }

  h1 { font-size: 23px; font-weight: 700; color: #294a42; margin: 0 0 18px 0; line-height: 1.5; }
  h2 { font-size: 19px; font-weight: 700; color: #357064; margin: 28px 0 14px 0; padding: 12px 18px; background: #ffffff; border-radius: 16px; line-height: 1.5; box-shadow: 0 2px 10px rgba(60,120,110,0.06); }
  h3 { font-size: 17px; font-weight: 700; color: #4a8a7c; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #4a8a7c; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 2.0; color: #33443f; margin: 16px 0; }
  strong { font-weight: 700; color: #357064; }
  em { font-style: italic; color: #33443f; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #dceee9; color: #357064; padding: 2px 6px; border-radius: 8px; }
  pre { background: #ffffff; color: #357064; padding: 16px; border-radius: 16px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(74,138,124,0.14); }
  pre code { background: none; color: #357064; padding: 0; }
  blockquote { border-left: 4px solid #4a8a7c; background: #ffffff; margin: 16px 0; padding: 16px 18px; border-radius: 0 16px 16px 0; color: #3f584f; }
  blockquote p { margin: 8px 0; color: #3f584f; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 2.0; color: #33443f; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #ffffff; border-radius: 16px; overflow: hidden; }
  thead { background: #4a8a7c; }
  th { background: #4a8a7c; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #4a8a7c; }
  td { padding: 10px 14px; border: 1px solid rgba(74,138,124,0.14); color: #33443f; }
  tr { background: #ffffff; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 16px; }
  a { color: #4a8a7c; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(74,138,124,0.16); margin: 24px 0; }
