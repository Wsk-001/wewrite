name: "bg-hot-tech"
description: "热门科技风：深紫渐变底配霓虹点缀，未来感，科技/AI/数码账号热门"
page_background: "linear-gradient(160deg, #241b4a 0%, #322058 55%, #3d2a6e 100%)"
page_padding: "30px 24px"
css_randomize: true
colors:
  primary: "#7b5cff"
  secondary: "#a48cff"
  text: "#e6e2f5"
  text_light: "#a9a2c8"
  background: "rgba(255,255,255,0.07)"
  code_bg: "rgba(255,255,255,0.12)"
  code_color: "#c8b8ff"
  quote_border: "#7b5cff"
  quote_bg: "rgba(255,255,255,0.06)"
  border_radius: "12px"
  highlight_bg: "rgba(255,255,255,0.07)"
  highlight_border: "rgba(123,92,255,0.35)"
  summary_bg: "rgba(255,255,255,0.07)"
  summary_border: "rgba(123,92,255,0.35)"
darkmode:
  background: "#1a1434"
  text: "#e6e2f5"
  text_light: "#a9a2c8"
  primary: "#9a82ff"
  code_bg: "rgba(255,255,255,0.12)"
  code_color: "#c8b8ff"
  quote_bg: "rgba(255,255,255,0.06)"
  quote_border: "#7b5cff"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #e6e2f5;
  }

  h1 { font-size: 23px; font-weight: 800; color: #ffffff; margin: 0 0 18px 0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #ffffff; margin: 24px 0 14px 0; padding: 12px 16px; background: rgba(255,255,255,0.09); border-radius: 12px; border-left: 5px solid #7b5cff; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #c8b8ff; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #c8b8ff; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.9; color: #e6e2f5; margin: 14px 0; }
  strong { font-weight: 700; color: #b8a8ff; }
  em { font-style: italic; color: #e6e2f5; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: rgba(255,255,255,0.12); color: #c8b8ff; padding: 2px 6px; border-radius: 6px; }
  pre { background: rgba(255,255,255,0.07); color: #c8b8ff; padding: 16px; border-radius: 12px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(123,92,255,0.3); }
  pre code { background: none; color: #c8b8ff; padding: 0; }
  blockquote { border-left: 4px solid #7b5cff; background: rgba(255,255,255,0.07); margin: 16px 0; padding: 14px 16px; border-radius: 0 12px 12px 0; color: #d0cae8; }
  blockquote p { margin: 8px 0; color: #d0cae8; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.9; color: #e6e2f5; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; }
  thead { background: #7b5cff; }
  th { background: #7b5cff; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #7b5cff; }
  td { padding: 10px 14px; border: 1px solid rgba(123,92,255,0.25); color: #e6e2f5; }
  tr { background: transparent; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 12px; }
  a { color: #b8a8ff; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(123,92,255,0.3); margin: 24px 0; }
