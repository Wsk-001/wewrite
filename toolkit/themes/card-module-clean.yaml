name: "card-module-clean"
description: "卡片模块化：结构清晰、模块化扫读，适合清单/对比/体检解读类健康科普"
colors:
  primary: "#4f46e5"
  secondary: "#111827"
  text: "#33383f"
  text_light: "#6b7280"
  background: "#ffffff"
  code_bg: "#eef2ff"
  code_color: "#4338ca"
  quote_border: "#4f46e5"
  quote_bg: "#eef2ff"
  border_radius: "12px"
  highlight_bg: "#eef2ff"
  highlight_border: "#e5e7eb"
  summary_bg: "#eef2ff"
  summary_border: "#e5e7eb"
darkmode:
  background: "#111827"
  text: "#d1d5db"
  text_light: "#9ca3af"
  primary: "#a5b4fc"
  code_bg: "#1e2433"
  code_color: "#c7d2fe"
  quote_bg: "#1e2433"
  quote_border: "#4f46e5"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.85;
    color: #33383f;
    background: #ffffff;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 24px;
    font-weight: 800;
    color: #111827;
    margin: 32px 0 16px 0;
    line-height: 1.45;
  }

  h2 {
    font-size: 19px;
    font-weight: 800;
    color: #111827;
    margin: 28px 0 14px 0;
    padding: 12px 16px;
    background: #eef2ff;
    border-radius: 12px;
    line-height: 1.5;
  }

  h3 {
    font-size: 17px;
    font-weight: 800;
    color: #111827;
    margin: 22px 0 12px 0;
    line-height: 1.5;
  }

  h4 {
    font-size: 16px;
    font-weight: 700;
    color: #4f46e5;
    margin: 20px 0 10px 0;
    line-height: 1.5;
  }

  p {
    font-size: 16px;
    line-height: 1.85;
    color: #33383f;
    margin: 12px 0;
  }

  strong {
    font-weight: 700;
    color: #4f46e5;
  }

  em {
    font-style: italic;
    color: #33383f;
  }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: #eef2ff;
    color: #4338ca;
    padding: 2px 6px;
    border-radius: 6px;
  }

  pre {
    background: #eef2ff;
    color: #4338ca;
    padding: 16px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 16px 0;
    line-height: 1.6;
    border: 1px solid #e0e7ff;
  }

  pre code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: none;
    color: #4338ca;
    padding: 0;
    border-radius: 0;
  }

  blockquote {
    border-left: 4px solid #4f46e5;
    background: #eef2ff;
    margin: 16px 0;
    padding: 12px 16px;
    border-radius: 0 12px 12px 0;
    color: #3730a3;
  }

  blockquote p {
    margin: 8px 0;
    color: #3730a3;
  }

  ul {
    padding-left: 24px;
    margin: 12px 0;
  }

  ol {
    padding-left: 24px;
    margin: 12px 0;
  }

  li {
    font-size: 16px;
    line-height: 1.85;
    color: #33383f;
    margin: 6px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 15px;
  }

  thead {
    background: #4f46e5;
  }

  th {
    background: #4f46e5;
    color: #ffffff;
    font-weight: 700;
    padding: 10px 14px;
    text-align: left;
    border: 1px solid #4f46e5;
  }

  td {
    padding: 10px 14px;
    border: 1px solid #e5e7eb;
    color: #33383f;
  }

  tr {
    background: #ffffff;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 24px auto;
    border-radius: 12px;
  }

  a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: 600;
  }

  hr {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 24px 0;
  }
