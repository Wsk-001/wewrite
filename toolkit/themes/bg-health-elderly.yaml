name: "bg-health-elderly"
description: "健康-适老大字：暖白护眼底配高对比大字号，面向中老年读者，易读优先"
page_background: "#f9f6ec"
page_padding: "30px 24px"
css_randomize: true
colors:
  primary: "#1f5a8a"
  secondary: "#164a72"
  text: "#1f1f1f"
  text_light: "#6a6a6a"
  background: "#ffffff"
  code_bg: "#e8f0f6"
  code_color: "#164a72"
  quote_border: "#1f5a8a"
  quote_bg: "#ffffff"
  border_radius: "8px"
  highlight_bg: "#ffffff"
  highlight_border: "rgba(31,90,138,0.2)"
  summary_bg: "#ffffff"
  summary_border: "rgba(31,90,138,0.2)"
darkmode:
  background: "#141414"
  text: "#f0f0f0"
  text_light: "#a0a0a0"
  primary: "#5a9ad0"
  code_bg: "#1e2a34"
  code_color: "#a0c8f0"
  quote_bg: "#ffffff"
  quote_border: "#1f5a8a"
base_css: |
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Heiti SC", sans-serif;
    font-size: 18px;
    line-height: 2.1;
    color: #1f1f1f;
  }

  h1 { font-size: 26px; font-weight: 800; color: #103a5c; margin: 0 0 18px 0; padding-bottom: 12px; border-bottom: 3px solid #1f5a8a; line-height: 1.5; }
  h2 { font-size: 22px; font-weight: 800; color: #164a72; margin: 26px 0 14px 0; padding: 12px 16px; background: #ffffff; border-radius: 8px; border-left: 6px solid #1f5a8a; line-height: 1.5; }
  h3 { font-size: 20px; font-weight: 700; color: #164a72; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 18px; font-weight: 700; color: #1f5a8a; margin: 20px 0 10px 0; }
  p { font-size: 18px; line-height: 2.1; color: #1f1f1f; margin: 16px 0; }
  strong { font-weight: 800; color: #164a72; }
  em { font-style: italic; color: #1f1f1f; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 16px; background: #e8f0f6; color: #164a72; padding: 2px 6px; border-radius: 6px; }
  pre { background: #ffffff; color: #164a72; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0; line-height: 1.7; border: 1px solid rgba(31,90,138,0.16); }
  pre code { background: none; color: #164a72; padding: 0; }
  blockquote { border-left: 5px solid #1f5a8a; background: #ffffff; margin: 16px 0; padding: 16px 18px; border-radius: 0 8px 8px 0; color: #2a3a48; }
  blockquote p { margin: 8px 0; color: #2a3a48; }
  ul, ol { padding-left: 26px; margin: 14px 0; }
  li { font-size: 18px; line-height: 2.1; color: #1f1f1f; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 17px; background: #ffffff; }
  thead { background: #1f5a8a; }
  th { background: #1f5a8a; color: #fff; font-weight: 700; padding: 12px 14px; text-align: left; border: 1px solid #1f5a8a; }
  td { padding: 12px 14px; border: 1px solid rgba(31,90,138,0.18); color: #1f1f1f; }
  tr { background: #ffffff; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 8px; }
  a { color: #1f5a8a; text-decoration: none; font-weight: 700; }
  hr { border: none; border-top: 2px solid rgba(31,90,138,0.2); margin: 26px 0; }
