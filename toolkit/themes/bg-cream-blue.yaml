name: "bg-cream-blue"
description: "奶油雾霾蓝：奶油底配雾霾蓝点缀，复古柔和，适合女性与生活健康内容"
page_background: "#f7f4ee"
page_padding: "28px 22px"
css_randomize: true
colors:
  primary: "#5a7a9a"
  secondary: "#7a95ad"
  text: "#3d4550"
  text_light: "#8593a0"
  background: "#f7f4ee"
  code_bg: "#e7eef4"
  code_color: "#4a6a8a"
  quote_border: "#5a7a9a"
  quote_bg: "#ecf1f6"
  border_radius: "12px"
  highlight_bg: "#ecf1f6"
  highlight_border: "rgba(90,122,154,0.18)"
  summary_bg: "#ecf1f6"
  summary_border: "rgba(90,122,154,0.18)"
darkmode:
  background: "#1c2230"
  text: "#cfd8e4"
  text_light: "#8a97a8"
  primary: "#8fb3d4"
  code_bg: "#262e3e"
  code_color: "#a8c8e8"
  quote_bg: "#262e3e"
  quote_border: "#5a7a9a"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #3d4550;
  }

  h1 { font-size: 23px; font-weight: 800; color: #3d4550; margin: 0 0 18px 0; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #4a6a8a; margin: 28px 0 14px 0; padding: 8px 14px; background: #ecf1f6; border-radius: 12px; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #5a7a9a; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #5a7a9a; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.9; color: #3d4550; margin: 14px 0; }
  strong { font-weight: 700; color: #4a6a8a; }
  em { font-style: italic; color: #3d4550; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #e7eef4; color: #4a6a8a; padding: 2px 6px; border-radius: 6px; }
  pre { background: #e7eef4; color: #4a6a8a; padding: 16px; border-radius: 12px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid #d6e2ec; }
  pre code { background: none; color: #4a6a8a; padding: 0; }
  blockquote { border-left: 4px solid #5a7a9a; background: #ecf1f6; margin: 16px 0; padding: 14px 16px; border-radius: 0 12px 12px 0; color: #46566a; }
  blockquote p { margin: 8px 0; color: #46566a; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.9; color: #3d4550; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; }
  thead { background: #5a7a9a; }
  th { background: #5a7a9a; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #5a7a9a; }
  td { padding: 10px 14px; border: 1px solid #d6e2ec; color: #3d4550; background: #fbfcfd; }
  tr { background: #fbfcfd; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 12px; }
  a { color: #5a7a9a; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid #d6e2ec; margin: 24px 0; }
