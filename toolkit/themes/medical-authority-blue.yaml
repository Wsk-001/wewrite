name: "medical-authority-blue"
description: "医院权威蓝：专业可信、数据感，适合医院/疾控/慢病指南类健康科普"
colors:
  primary: "#0b5aa5"
  secondary: "#1565c0"
  text: "#2b2f36"
  text_light: "#7a8798"
  background: "#ffffff"
  code_bg: "#eef5fc"
  code_color: "#0b5aa5"
  quote_border: "#0b5aa5"
  quote_bg: "#eef5fc"
  border_radius: "8px"
  highlight_bg: "#eef5fc"
  highlight_border: "rgba(11,90,165,0.18)"
  summary_bg: "#eef5fc"
  summary_border: "rgba(11,90,165,0.18)"
darkmode:
  background: "#0f1720"
  text: "#cfd8e3"
  text_light: "#8a98a8"
  primary: "#5aa9ff"
  code_bg: "#132234"
  code_color: "#8cc2ff"
  quote_bg: "#132234"
  quote_border: "#0b5aa5"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.85;
    color: #2b2f36;
    background: #ffffff;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 24px;
    font-weight: 800;
    color: #0b5aa5;
    margin: 32px 0 16px 0;
    padding-bottom: 12px;
    border-bottom: 2px solid #0b5aa5;
    line-height: 1.45;
  }

  h2 {
    font-size: 19px;
    font-weight: 700;
    color: #0b5aa5;
    margin: 28px 0 14px 0;
    padding: 6px 0 6px 12px;
    border-left: 4px solid #0b5aa5;
    line-height: 1.5;
  }

  h3 {
    font-size: 17px;
    font-weight: 700;
    color: #1565c0;
    margin: 22px 0 12px 0;
    line-height: 1.5;
  }

  h4 {
    font-size: 16px;
    font-weight: 600;
    color: #1565c0;
    margin: 20px 0 10px 0;
    line-height: 1.5;
  }

  p {
    font-size: 16px;
    line-height: 1.85;
    color: #2b2f36;
    margin: 14px 0;
  }

  strong {
    font-weight: 700;
    color: #0b5aa5;
  }

  em {
    font-style: italic;
    color: #2b2f36;
  }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: #eef5fc;
    color: #0b5aa5;
    padding: 2px 6px;
    border-radius: 4px;
  }

  pre {
    background: #eef5fc;
    color: #0b5aa5;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 16px 0;
    line-height: 1.6;
    border: 1px solid #d6e6fb;
  }

  pre code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: none;
    color: #0b5aa5;
    padding: 0;
    border-radius: 0;
  }

  blockquote {
    border-left: 4px solid #0b5aa5;
    background: #eef5fc;
    margin: 16px 0;
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    color: #23405c;
  }

  blockquote p {
    margin: 8px 0;
    color: #23405c;
  }

  ul {
    padding-left: 24px;
    margin: 12px 0;
  }

  ol {
    padding-left: 24px;
    margin: 12px 0;
  }

  li {
    font-size: 16px;
    line-height: 1.85;
    color: #2b2f36;
    margin: 6px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 15px;
  }

  thead {
    background: #0b5aa5;
  }

  th {
    background: #0b5aa5;
    color: #ffffff;
    font-weight: 600;
    padding: 10px 14px;
    text-align: left;
    border: 1px solid #0b5aa5;
  }

  td {
    padding: 10px 14px;
    border: 1px solid #d6e6fb;
    color: #2b2f36;
  }

  tr {
    background: #ffffff;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 24px auto;
    border-radius: 8px;
  }

  a {
    color: #0b5aa5;
    text-decoration: none;
    font-weight: 500;
  }

  hr {
    border: none;
    border-top: 1px solid #d6e6fb;
    margin: 24px 0;
  }
