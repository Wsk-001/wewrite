name: "bg-ink-paper"
description: "水墨宣纸底：米黄宣纸质地背景，国风温润，适合中医养生与节气科普"
page_background: "#f6f1e7"
page_padding: "28px 22px"
css_randomize: true
colors:
  primary: "#8a5a2b"
  secondary: "#6a4420"
  text: "#3b3327"
  text_light: "#8a7d68"
  background: "#fdfaf3"
  code_bg: "#efe7d6"
  code_color: "#7a5025"
  quote_border: "#8a5a2b"
  quote_bg: "#fdfaf3"
  border_radius: "6px"
  highlight_bg: "#fdfaf3"
  highlight_border: "#e0d3ba"
  summary_bg: "#fdfaf3"
  summary_border: "#e0d3ba"
darkmode:
  background: "#211c14"
  text: "#ddd0b8"
  text_light: "#a3947a"
  primary: "#c8a06a"
  code_bg: "#2c2618"
  code_color: "#d8bc88"
  quote_bg: "#fdfaf3"
  quote_border: "#8a5a2b"
base_css: |
  body {
    font-family: Georgia, "Songti SC", "STSong", "SimSun", serif;
    font-size: 16px;
    line-height: 2.0;
    color: #3b3327;
  }

  h1 { font-size: 23px; font-weight: 700; color: #5a3c1c; margin: 0 0 18px 0; padding-bottom: 6px; border-bottom: 2px solid #d8c8a8; line-height: 1.5; }
  h2 { font-size: 19px; font-weight: 700; color: #6a4420; margin: 26px 0 14px 0; padding: 10px 16px; background: #fdfaf3; border-radius: 6px; border: 1px solid #e0d3ba; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #8a5a2b; margin: 22px 0 12px 0; padding-left: 12px; border-left: 4px solid #8a5a2b; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #8a5a2b; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 2.0; color: #3b3327; margin: 14px 0; }
  strong { font-weight: 700; color: #6a4420; }
  em { font-style: italic; color: #3b3327; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #efe7d6; color: #7a5025; padding: 2px 6px; border-radius: 4px; }
  pre { background: #fdfaf3; color: #7a5025; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid #e0d3ba; }
  pre code { background: none; color: #7a5025; padding: 0; }
  blockquote { border-left: 4px solid #8a5a2b; background: #fdfaf3; margin: 16px 0; padding: 16px 18px; border-radius: 0 6px 6px 0; color: #5a4a34; }
  blockquote p { margin: 8px 0; color: #5a4a34; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 2.0; color: #3b3327; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #fdfaf3; }
  thead { background: #8a5a2b; }
  th { background: #8a5a2b; color: #fdfaf3; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #8a5a2b; }
  td { padding: 10px 14px; border: 1px solid #e0d3ba; color: #3b3327; }
  tr { background: #fdfaf3; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 6px; }
  a { color: #8a5a2b; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid #e0d3ba; margin: 24px 0; }
