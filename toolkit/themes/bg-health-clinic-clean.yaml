name: "bg-health-clinic-clean"
description: "健康-门诊清爽：浅青白渐变底配青绿点缀，就诊指南/科室科普干净专业"
page_background: "linear-gradient(165deg, #eaf6f4 0%, #eef8f6 55%, #f4fbf9 100%)"
page_padding: "30px 24px"
css_randomize: true
colors:
  primary: "#1f8a7a"
  secondary: "#156a5c"
  text: "#2c3f3b"
  text_light: "#75928c"
  background: "#ffffff"
  code_bg: "#d8f0ea"
  code_color: "#156a5c"
  quote_border: "#1f8a7a"
  quote_bg: "#ffffff"
  border_radius: "10px"
  highlight_bg: "#ffffff"
  highlight_border: "rgba(31,138,122,0.16)"
  summary_bg: "#ffffff"
  summary_border: "rgba(31,138,122,0.16)"
darkmode:
  background: "#0f221f"
  text: "#cce4de"
  text_light: "#88a8a0"
  primary: "#5ac0ae"
  code_bg: "#18302b"
  code_color: "#9fe0d2"
  quote_bg: "#ffffff"
  quote_border: "#1f8a7a"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #2c3f3b;
  }

  h1 { font-size: 23px; font-weight: 800; color: #124a40; margin: 0 0 18px 0; padding-bottom: 12px; border-bottom: 2px solid #1f8a7a; line-height: 1.45; }
  h2 { font-size: 19px; font-weight: 800; color: #156a5c; margin: 24px 0 14px 0; padding: 12px 16px; background: #ffffff; border-radius: 10px; border-left: 5px solid #1f8a7a; line-height: 1.5; }
  h3 { font-size: 17px; font-weight: 700; color: #156a5c; margin: 22px 0 12px 0; line-height: 1.5; }
  h4 { font-size: 16px; font-weight: 700; color: #1f8a7a; margin: 20px 0 10px 0; }
  p { font-size: 16px; line-height: 1.9; color: #2c3f3b; margin: 14px 0; }
  strong { font-weight: 700; color: #156a5c; }
  em { font-style: italic; color: #2c3f3b; }
  code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 14px; background: #d8f0ea; color: #156a5c; padding: 2px 6px; border-radius: 6px; }
  pre { background: #ffffff; color: #156a5c; padding: 16px; border-radius: 10px; overflow-x: auto; margin: 16px 0; line-height: 1.6; border: 1px solid rgba(31,138,122,0.14); }
  pre code { background: none; color: #156a5c; padding: 0; }
  blockquote { border-left: 4px solid #1f8a7a; background: #ffffff; margin: 16px 0; padding: 14px 16px; border-radius: 0 10px 10px 0; color: #365048; }
  blockquote p { margin: 8px 0; color: #365048; }
  ul, ol { padding-left: 24px; margin: 12px 0; }
  li { font-size: 16px; line-height: 1.9; color: #2c3f3b; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; background: #ffffff; border-radius: 10px; overflow: hidden; }
  thead { background: #1f8a7a; }
  th { background: #1f8a7a; color: #fff; font-weight: 700; padding: 10px 14px; text-align: left; border: 1px solid #1f8a7a; }
  td { padding: 10px 14px; border: 1px solid rgba(31,138,122,0.14); color: #2c3f3b; }
  tr { background: #ffffff; }
  img { max-width: 100%; height: auto; display: block; margin: 24px auto; border-radius: 10px; }
  a { color: #1f8a7a; text-decoration: none; font-weight: 600; }
  hr { border: none; border-top: 1px solid rgba(31,138,122,0.16); margin: 24px 0; }
