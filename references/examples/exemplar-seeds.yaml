# 通用人类写作模式种子
#
# 用途：没有范文库的用户，Step 4.4 用这些段落作为 few-shot 注入，
#       教 LLM "人类写作的结构模式长什么样"。

opening_hooks:
  - text: |
      好多年没有坐公交了，上次去太子湾，由于景区限行，只能把车停在外面，坐景区免费接驳车过去。
      前面座位看到一个小女孩一直在刷那种 AI 生成的短视频，画面非常粗糙，内容也很假，滑到下一个居然还是差不多的东西，看得津津有味。
      当时看到这一幕我甚至有点伤心。
    pattern: "日常观察切入 → 意外情绪反应。"

  - text: |
      **本硕八年毕业，单程通勤两个半小时，**月薪2690。 这是市场给我贴的标签。
      **裸辞。创业，年收超7位数。** 这是我自己撕掉那个标签之后，重新定义的自己。
      一路走来，中间发生了什么？我讲给你听。
    pattern: "标签→撕裂对比开头。"

emotional_peaks:
  - text: |
      我信了这套话很多年。
      最惨的一次，在一个方向扎进去3年，回头一看，什么都没留下来。
      这不是失败——失败还有个明确的结果。
      是你信错了一件事。
    pattern: "用'最惨'而非'有挑战'。"

  - text: |
      讲真，我每次看到这种争论，都觉得……怎么说呢……挺无语的。
      不是说这些人蠢。
      是他们在纠结一个根本不存在的问题。
      什么叫"AI味道"？你能定义吗？你能量化吗？你能验证吗？
      不能。
      那你在纠结什么？
    pattern: "填充词 + 连续反问 + 单字段落。"

transitions:
  - text: |
      我第一反应是"孩子这时候不应该在学校吗"，第二反应是想把这话发过去，第三反应是我把那句话吞回去了——因为我在那三秒里想清楚了一件事。
    pattern: "思维过程外化。破折号打断 → 悬念。"

  - text: |
      不过话又说回来。知道自己在局里，这件事本身，就已经是出局的开始了。
    pattern: "'不过话又说回来'——自我推翻后重新定位。"

closings:
  - text: |
      时间是你唯一不可再生的资源。
      把它投进一个真实存在的锚点，才叫复利。
      投进一个"我相信它会好"的希望，叫做漫长的等死。
    pattern: "重新定义核心概念收尾。"

  - text: |
      不要在那个愣住的感觉里待太久。
      那个感觉，待久了，就成了借口。
    pattern: "回扣开头意象。两句话收束。"n      不能。\n      那你在纠结什么？\n    pattern: \"填充词 + 连续反问 + 单字段落。\"\n\ntransitions:\n  - text: |\n      我第一反应是\"孩子这时候不应该在学校吗\"，第二反应是想把这话发过去，第三反应是我把那句话吞回去了——因为我在那三秒里想清楚了一件事。\n    pattern: \"思维过程外化。破折号打断 → 悬念。\"\n\n  - text: |\n      不过话又说回来。知道自己在局里，这件事本身，就已经是出局的开始了。\n    pattern: \"'不过话又说回来'——自我推翻后重新定位。\"\n\nclosings:\n  - text: |\n      时间是你唯一不可再生的资源。\n      把它投进一个真实存在的锚点，才叫复利。\n      投进一个\"我相信它会好\"的希望，叫做漫长的等死。\n    pattern: \"重新定义核心概念收尾。\"\n\n  - text: |\n      不要在那个愣住的感觉里待太久。\n      那个感觉，待久了，就成了借口。\n    pattern: \"回扣开头意象。两句话收束。\"\n"}]